# CLI-deploy via GitHub secrets (backup hvis Vercel Git-integration ikke trigger).
# Secrets: npm run vercel:secrets
# Token: https://vercel.com/account/tokens → GitHub → Settings → Secrets → VERCEL_TOKEN
#
# Vercel UI for projekt "vinbot": Root Directory skal være TOM (ikke "legacy").
# Project → Settings → Git skal pege på KaasLarsen/vinbot, branch main.

name: Deploy production to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bekræft Next.js repo (ikke kun legacy)
        run: |
          test -f app/layout.tsx || (echo "::error::Mangler app/layout.tsx — forkert root eller gammelt checkout"; exit 1)
          node -e "const p=require('./package.json'); if(!p.dependencies?.next) { process.exit(1) }" || (echo "::error::package.json skal have next"; exit 1)

      - name: Tjek Vercel secrets
        id: secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::error::Mangler VERCEL_TOKEN, VERCEL_ORG_ID eller VERCEL_PROJECT_ID. Kør: npm run vercel:secrets"
            exit 1
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Valider VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/vercel-whoami.json -w "%{http_code}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            https://api.vercel.com/v2/user)
          if [ "$code" != "200" ]; then
            echo "::error::VERCEL_TOKEN er ugyldig eller udløbet (HTTP $code). Opret nyt token på https://vercel.com/account/tokens og opdater GitHub secret VERCEL_TOKEN (Settings → Secrets and variables → Actions). Eller kør: npm run vercel:secrets"
            cat /tmp/vercel-whoami.json || true
            exit 1
          fi
          echo "Vercel-token OK."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Deploy til Vercel
        run: npx vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
